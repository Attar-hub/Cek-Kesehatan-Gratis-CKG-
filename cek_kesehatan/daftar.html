<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pendaftaran - SehatBersama</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Navbar -->
    <nav class="navbar">
        <div class="logo">
            <img src="./image/logo-semarang.png" alt="Logo" class="nav-logo">
            Sehat<span>Bersama</span>
        </div>

        <div class="menu">
        <a href="index.html">Beranda</a>
        <a href="tentang.html">Tentang</a>
        <a href="layanan.html">Layanan</a>
        <a href="kontak.html">Kontak</a>
        </div>
    </nav>

    <!-- Form Pendaftaran -->
    <section class="form-section">

        <div class="form-container">

            <div class="form-header">
                <p class="small-title">PENDAFTARAN</p>

                <h1>Daftar Cek Kesehatan Gratis</h1>

                <p>
                    Silakan isi data diri dengan benar untuk
                    melakukan pendaftaran pemeriksaan kesehatan.
                </p>
            </div>


            <form action="proses_daftar.php" method="POST">

                <div class="form-group">
                    <label for="nama">Nama Lengkap</label>
                    <input 
                        type="text" 
                        id="nama"
                        name="nama_lengkap"
                        placeholder="Masukkan nama lengkap"
                        required
                    >
                </div>


                <div class="form-group">
                    <label for="nik">NIK</label>
                    <input 
                        type="text" 
                        id="nik"
                        name="nik" 
                        placeholder="Masukkan NIK"
                        maxlength="16"
                        required
                    >
                </div>

                <div class="form-row">

                    <div class="form-group">
                        <label for="tanggal">Tanggal Lahir</label>
                        <input 
                            type="date" 
                            id="tanggal"
                            name="tanggal_lahir"
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label for="jenis-kelamin">Jenis Kelamin</label>

                        <select id="jenis-kelamin" name="jenis_kelamin" required>
                            <option value="">Pilih</option>
                            <option value="Laki-laki">Laki-laki</option>
                            <option value="Perempuan">Perempuan</option>
                        </select>
                    </div>

                </div>


                <div class="form-group">
                    <label for="telepon">Nomor HP</label>
                    <input 
                        type="tel" 
                        id="telepon"
                        name="nomor_hp"
                        placeholder="Contoh: 081234567890"
                        required
                    >
                </div>


                <div class="form-group">
                    <label for="alamat">Alamat</label>

                    <textarea 
                        id="alamat"
                        name="alamat"
                        rows="4"
                        placeholder="Masukkan alamat lengkap"
                        required
                    ></textarea>
                </div>


                <div class="form-group">
                    <label for="pemeriksaan">
                        Pilihan Pemeriksaan
                    </label>

                    <select id="pemeriksaan" name="pemeriksaan" required>
                        <option value="">Pilih pemeriksaan</option>
                        <option value="Tekanan Darah">
                            Cek Tekanan Darah
                        </option>
                        <option value="Gula Darah">
                            Cek Gula Darah
                        </option>
                        <option value="Konsultasi">
                            Konsultasi Kesehatan
                        </option>
                    </select>
                </div>


                <div class="form-group">
                    <label for="jadwal">
                        Tanggal Pemeriksaan
                    </label>

                    <input 
                        type="date" 
                        id="jadwal"
                        name="tanggal_pemeriksaan"
                        required
                    >
                </div>


                <button type="submit" class="btn-daftar">
                    Kirim Pendaftaran
                </button>

            </form>

        </div>

    </section>

</body>
</html>
